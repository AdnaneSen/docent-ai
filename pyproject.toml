[project]
name = "docent"
version = "0.1.0"
description = "Config-driven, MCP-native document agent with a query router and grounded, citation-backed answers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "AdnaneSen" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "chromadb>=1.0",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docent"]

[tool.ruff]
line-length = 100